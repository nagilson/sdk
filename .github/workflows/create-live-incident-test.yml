name: Create Live Incident Trigger Test

on:
  workflow_dispatch:

permissions:
  issues: write

env:
  DOTNET_CLI_TELEMETRY_SESSIONID: gha-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create live incident issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Issue Monster provenance test] Run ${context.runId}`,
              body: "Validates that a live build incident created by github-actions[bot] enters the immediate Issue Monster path.",
              labels: ["cookie", "live-build-incident"],
            });
            core.notice(`Created ${issue.html_url}`);
