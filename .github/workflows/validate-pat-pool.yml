name: Validate PAT Pool

on:
  schedule:
    - cron: '17 2 * * *' # Daily at ~2:17 AM UTC (off-round to reduce contention)
  workflow_dispatch:

# No GitHub API permissions needed
permissions: {}

env:
  DOTNET_CLI_TELEMETRY_SESSIONID: gha-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.fork }}
    # Fetched at run time with access to the copilot-pat-pool secrets: keep this pinned to a SHA on dotnet/arcade-skills main.
    uses: nagilson/arcade-skills/.github/workflows/validate-pat-pool.yml@c22cf7c5d7800bd22a8cdc6dfb07eb1846d18689
    with:
      environment: copilot-pat-pool
    # Environment secrets reach the called job only through inherit; a caller job cannot declare environment:.
    secrets: inherit
